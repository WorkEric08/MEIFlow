<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover habilita uso de safe-area-inset-* sob notch/gestos.
         O user-scalable=no é aplicado dinamicamente apenas em modo standalone. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
      id="viewport-meta"
    />
    <meta name="theme-color" content="#0D1117" id="theme-color-meta" />
    <meta name="description" content="Plataforma completa para freelancers e MEIs brasileiros" />

    <!-- Capacidades de "web app" — fazem o site se comportar como aplicativo
         nativo quando adicionado à home screen (Android + iOS). -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MEIFlow" />
    <meta name="application-name" content="MEIFlow" />
    <meta name="format-detection" content="telephone=no" />

    <link rel="icon" type="image/png" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- O <link rel="manifest"> é injetado automaticamente pelo vite-plugin-pwa -->
    <title>MEIFlow</title>

    <!-- Captura beforeinstallprompt antes do bundle React carregar -->
    <script>
      window.__deferredInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__deferredInstallPrompt = e;
      });

      // Aplica tema salvo antes do primeiro render (evita flash)
      (function() {
        try {
          var stored = localStorage.getItem('meiflow-theme');
          var theme = stored ? JSON.parse(stored).state?.theme : 'dark';
          if (theme !== 'light') document.documentElement.classList.add('dark');
        } catch(_) {
          document.documentElement.classList.add('dark');
        }
      })();

      // Detecta modo standalone e ajusta viewport + classes <html> antes do React montar.
      // Isso evita flash de seleção/zoom no boot do PWA.
      (function() {
        try {
          var standalone =
            window.matchMedia('(display-mode: standalone)').matches ||
            window.matchMedia('(display-mode: minimal-ui)').matches ||
            window.matchMedia('(display-mode: fullscreen)').matches ||
            (typeof navigator !== 'undefined' && navigator.standalone === true);
          if (!standalone) return;

          var ua = navigator.userAgent || '';
          var isAndroid = /Android/i.test(ua);
          var isIOS = /iPhone|iPad|iPod/i.test(ua);
          var coarse = window.matchMedia('(pointer: coarse)').matches;
          var isMobile = isAndroid || isIOS || (coarse && window.innerWidth <= 1024);

          var html = document.documentElement;
          html.classList.add('pwa-standalone');
          if (isMobile) {
            html.classList.add('pwa-mobile');
            if (isAndroid) html.classList.add('pwa-android');
            if (isIOS) html.classList.add('pwa-ios');

            // Bloqueia zoom por pinça/double-tap em modo app
            var vp = document.getElementById('viewport-meta');
            if (vp) {
              vp.setAttribute(
                'content',
                'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover'
              );
            }
          }
        } catch(_) {}
      })();
    </script>
    <script type="module" crossorigin src="/assets/index-CsTimxsG.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-jy-JvuwH.css">
  <link rel="manifest" href="/manifest.webmanifest"><script id="vite-plugin-pwa:register-sw" src="/registerSW.js"></script></head>
  <body>
    <div id="root"></div>
  </body>
</html>
